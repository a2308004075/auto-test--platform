# 生产环境配置

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:auto_test_platform}?useSSL=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

  flyway:
    validate-on-migrate: true
    clean-disabled: true

# JWT 密钥（生产环境必须通过环境变量设置）
jwt:
  secret: ${JWT_SECRET}

# 生产环境日志
logging:
  level:
    root: WARN
    com.platform: INFO

# 关闭 Whitelabel 错误页
server:
  error:
    whitelabel:
      enabled: false
